<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Mona Lisa Puzzle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Philosopher&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
  @font-face {
    font-family: 'SWScrps';
    src: url('fonts/SWScrps.ttf') format('truetype');
  }
  html, body {
    height: 100%;
    margin: 0;
    background: #000;
    color: #fff;
    font-family: IPAMonaPGothic, Monapo, Mona, sans-serif;
    /* スクロールバーを隠しつつ、JSでのスクロールは可能にする */
    overflow: hidden;
  }
  .screen {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas { 
    display: block; 
  }
  #canvas1 {
    position: absolute; /* ボタンとの重なりを制御するため */
  }
  #nextButton {
    position: absolute;
    left: 40%;
    transform: translateX(-50%);
    bottom: 50px;
    padding: 4px 20px;
    /*border: 1cap solid rgba(255, 255, 255, 0.9);
    border-radius: 1px;*/
    cursor: pointer; /*マウスの形が変わる*/
    font: 18px 'SWScrps', serif;
    background: rgba(0, 0, 0, 0.5);
    color: white;
    display: none; /* 初期状態では非表示 */
    user-select: none;
    z-index: 10; /* 必ず手前に表示する */
      }
  #marqueeText {
    position: absolute;
    left: 100%; /* 右端からスタート */
    top: 20px; /* 画面上部に変更 */
    font: 18px 'SWScrps', serif;
    color: #ccc;
    white-space: nowrap; /* テキストを折り返さない */
    display: block; /* 初期状態で表示 */
    animation: marquee 15s linear infinite;
    z-index: 10;
  }

  @keyframes marquee {
    0% {
      transform: translateX(0);
    }
    100% {
      transform: translateX(-150vw); /* 画面幅以上に移動して完全に消えるように */
    }
  }
  #quitButton {
    position: absolute;
    top: 97%;
    left: 5%;
    transform: translate(-50%, -50%);
    color: white;
    font-family: 'SWScrps', serif;
    font-size: 20px;
    text-decoration: none;
    opacity: 1;
    transition: opacity 1s ease;
    z-index: 10;
    pointer-events: auto; /* Initially clickable */
  }
</style>
</head>
<body>
  <!-- 1画面目: 3x3パズル + 文字アニメーション -->
  <section id="screen1" class="screen">
    <canvas id="canvas1"></canvas>
    <a id="quitButton" href="../index.html">QUIT</a>
  </section>

  <div id="nextButton">NEXT</div>
  <div id="marqueeText">It is a puzzle of the Mona Lisa. Put the rest of the puzzles together and complete them.</div>
  <!-- 2画面目はJSでここに追加されます -->

<script>

/* ------------------------------------
   画面1: 3x3パズル + 文字アニメーション
   ------------------------------------ */
function setupScreen1() {
  const screen1 = document.getElementById("screen1");
  const canvas = document.getElementById("canvas1");
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const images = [];
  const fixedIndexes = [1, 2, 4, 7];
  const targetPositions = [];
  const imgWidth = 150 * 0.7;
  const imgHeight = 224 * 0.7;
  let dragging = null;
  let offsetX = 0;
  let offsetY = 0;
  let puzzleCompleted = false;

  const nextButton = document.getElementById('nextButton');

  // --- 文字アニメーションの設定 ---
  const text = "Mona Lisa";
  const fontSize = 80;
  const targetStartX = 150;
  const targetStartY = 250;
  const layers = [
    { targetAlpha: 0.1, offset: 6, delay: 0 },
    { targetAlpha: 0.2, offset: 4, delay: 20 },
    { targetAlpha: 0.4, offset: 2, delay: 40 },
    { targetAlpha: 1.0, offset: 0, delay: 60 }
  ];
  layers.forEach(layer => {
    layer.targetX = targetStartX + layer.offset;
    layer.targetY = targetStartY + layer.offset;
    layer.currentX = layer.targetX;
    layer.currentY = layer.targetY + 200;
    layer.currentAlpha = 0;
    layer.delayCounter = layer.delay;
  });

  function drawTextAnimation() {
    ctx.font = `${fontSize}px SWScrps, serif`;
    ctx.textAlign = "left";
    layers.forEach(layer => {
      if (layer.delayCounter > 0) { layer.delayCounter--; return; }
      const ease = 0.02;
      layer.currentX += (layer.targetX - layer.currentX) * ease;
      layer.currentY += (layer.targetY - layer.currentY) * ease;
      layer.currentAlpha += (layer.targetAlpha - layer.currentAlpha) * ease;
      ctx.fillStyle = `rgba(255, 255, 255, ${layer.currentAlpha})`;
      ctx.fillText(text, layer.currentX, layer.currentY);
    });
  }

  // --- 3x3 パズルの設定 ---
  for (let i = 1; i <= 9; i++) {
    const img = new Image();
    img.src = `../images/mo${i}.jpg`;
    images.push({ img, x: 0, y: 0, targetX: 0, targetY: 0, fixed: fixedIndexes.includes(i - 1) });
  }

  const gridStartX = canvas.width / 2;
  const gridStartY = canvas.height / 2 - (imgHeight * 3) / 2;
  for (let row = 0; row < 3; row++) {
    for (let col = 0; col < 3; col++) {
      targetPositions.push({ x: gridStartX + col * imgWidth, y: gridStartY + row * imgHeight });
    }
  }

  images.forEach((obj, i) => {
    const t = targetPositions[i];
    obj.targetX = t.x;
    obj.targetY = t.y;
    if (obj.fixed) {
      obj.x = t.x;
      obj.y = t.y;
    } else {
      obj.x = Math.random() * (canvas.width / 2 - imgWidth);
      obj.y = Math.random() * (canvas.height - imgHeight);
    }
  });

  function checkCompletion() {
    if (puzzleCompleted) return;
    const allInPlace = images.every(obj => Math.abs(obj.x - obj.targetX) < 1 && Math.abs(obj.y - obj.targetY) < 1);
    if (allInPlace) {
      puzzleCompleted = true;
      // パズルが完成したら、section全体がクリックを邪魔しないようにする
      screen1.style.pointerEvents = 'none';
      document.getElementById('marqueeText').style.display = 'none'; // テロップを消す
      nextButton.style.display = 'block';
    }
  }

  // --- マウス操作 (画面1) ---
  canvas.addEventListener('mousedown', e => {
    if (puzzleCompleted) return;
    const mx = e.offsetX, my = e.offsetY;
    for (let i = images.length - 1; i >= 0; i--) {
      const obj = images[i];
      if (!obj.fixed && mx > obj.x && mx < obj.x + imgWidth && my > obj.y && my < obj.y + imgHeight) {
        dragging = obj;
        offsetX = mx - obj.x;
        offsetY = my - obj.y;
        images.splice(i, 1);
        images.push(dragging);
        break;
      }
    }
  });
  canvas.addEventListener('mousemove', e => {
    if (dragging) {
      dragging.x = e.offsetX - offsetX;
      dragging.y = e.offsetY - offsetY;
    }
  });
  canvas.addEventListener('mouseup', e => {
    if (dragging) {
      const dx = dragging.x - dragging.targetX;
      const dy = dragging.y - dragging.targetY;
      if (Math.sqrt(dx * dx + dy * dy) < 50) {
        dragging.x = dragging.targetX;
        dragging.y = dragging.targetY;
        checkCompletion();
      }
      dragging = null;
    }
  });

  // --- 描画ループ (画面1) ---
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawTextAnimation();
    images.forEach(obj => ctx.drawImage(obj.img, obj.x, obj.y, imgWidth, imgHeight));
    requestAnimationFrame(draw);
  }
  draw();
}

/* ------------------------------------
   画面2: 6x6パズル
   ------------------------------------ */
function setupScreen2() {
  // 新しいセクションとキャンバスを生成
  const screen2 = document.createElement('section');
  screen2.id = 'screen2';
  screen2.className = 'screen';
  const canvas = document.createElement('canvas');
  canvas.id = 'canvas2';
  screen2.appendChild(canvas);
  // nextButtonの前に挿入することで、ボタンが常に最前面に来るようにする
  document.body.insertBefore(screen2, document.getElementById('nextButton'));

  // スムーズにスクロール
  screen2.scrollIntoView({ behavior: 'smooth' });

  const ctx = canvas.getContext("2d");
  const nextButton = document.getElementById('nextButton'); // ここでもボタンを取得
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  // --- 6x6 パズルの設定 ---
  const GRID = 6;
  const MAX_PUZZLE_WIDTH = 330;
  const pieceWidth = MAX_PUZZLE_WIDTH / GRID;
  const pieceHeight = pieceWidth * (224 / 150);

  const pieces = [];
  let puzzle2Completed = false;
  const targetPositions = [];
  let dragging = null;
  let offsetX = 0;
  let offsetY = 0;
  const fixedIndexes = [1, 3, 5, 8, 10, 11, 13, 15, 17, 20, 22, 24, 25, 27, 29, 32, 34, 36].map(n => n - 1);

  const puzzleWidth = pieceWidth * GRID;
  const puzzleHeight = pieceHeight * GRID;
  const startX = canvas.width * 0.55;
  const startY = canvas.height / 2 - puzzleHeight / 2;

  for (let row = 0; row < GRID; row++) {
    for (let col = 0; col < GRID; col++) {
      targetPositions.push({ x: startX + col * pieceWidth, y: startY + row * pieceHeight });
    }
  }

  const imagePromises = [];
  for (let i = 1; i <= GRID * GRID; i++) {
    const img = new Image();
    const promise = new Promise((resolve, reject) => {
      img.onload = () => resolve({ img, index: i - 1 });
      img.onerror = () => reject(`画像の読み込みに失敗: mona/memo${i}.jpg`);
    });
    img.src = `../images/mona/memo${i}.jpg`; // 画像パスを修正
    imagePromises.push(promise);
  }

  Promise.all(imagePromises).then(loadedImages => {
    loadedImages.sort((a, b) => a.index - b.index);
    loadedImages.forEach((loaded, i) => {
      const target = targetPositions[i];
      const isFixed = fixedIndexes.includes(i);
      const piece = { img: loaded.img, x: 0, y: 0, targetX: target.x, targetY: target.y, fixed: isFixed };
      if (isFixed) {
        piece.x = target.x;
        piece.y = target.y;
      } else {
        piece.x = Math.random() * (canvas.width / 2 - pieceWidth);
        piece.y = Math.random() * (canvas.height - pieceHeight);
      }
      pieces.push(piece);
    });
    animate();
  }).catch(error => {
    console.error(error);
    ctx.fillStyle = 'red';
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(error, canvas.width / 2, canvas.height / 2);
  });

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => ctx.drawImage(p.img, p.x, p.y, pieceWidth, pieceHeight));
    requestAnimationFrame(animate);
  }

  function checkCompletion2() {
    if (puzzle2Completed) return;
    const allInPlace = pieces.every(p => Math.abs(p.x - p.targetX) < 1 && Math.abs(p.y - p.targetY) < 1);
    if (allInPlace) {
      puzzle2Completed = true;
      // --- 2画面目完成時の処理 ---
      nextButton.textContent = 'QUIT'; // インデックスに戻る'QUIT'
      document.getElementById('marqueeText').style.display = 'none'; // 流れるテキストを非表示
      currentButtonState = 'quit'; // ボタンの状態を更新
      setTimeout(() => {
        alert('素晴らしい！全てのパズルが完成しました！');
      }, 200);
    }
  }

  // --- マウス操作 (画面2) ---
  canvas.addEventListener('mousedown', e => {
    const mx = e.offsetX, my = e.offsetY; // prettier-ignore
    for (let i = pieces.length - 1; i >= 0; i--) {
      const p = pieces[i];
      if (!p.fixed && mx > p.x && mx < p.x + pieceWidth && my > p.y && my < p.y + pieceHeight) {
        dragging = p;
        offsetX = mx - p.x;
        offsetY = my - p.y;
        pieces.splice(i, 1);
        pieces.push(dragging);
        break;
      }
    }
  });
  canvas.addEventListener('mousemove', e => {
    if (dragging) {
      dragging.x = e.offsetX - offsetX;
      dragging.y = e.offsetY - offsetY;
    }
  });
  canvas.addEventListener('mouseup', e => {
    if (dragging) {
      const dx = dragging.x - dragging.targetX;
      const dy = dragging.y - dragging.targetY;
      if (Math.sqrt(dx * dx + dy * dy) < 50) {
        dragging.x = dragging.targetX;
        dragging.y = dragging.targetY;
        checkCompletion2(); // 完成チェック
      }
      dragging = null;
    }
  });
}


// --- 初期化処理 ---
setupScreen1();

const nextButton = document.getElementById('nextButton');
const marqueeText = document.getElementById('marqueeText');
let screen2Initialized = false;
let currentButtonState = 'next'; // 'next', 'back', 'quit'

nextButton.addEventListener('click', () => {
  switch (currentButtonState) {
    case 'next':
      // 最初のクリック: 2画面目を表示
      if (!screen2Initialized) {
        setupScreen2();
        screen2Initialized = true;
      } else {
        document.getElementById('screen2').scrollIntoView({ behavior: 'smooth' });
      }
      // メッセージを「戻る」案内に変更し、位置を下に移動させてから表示
      marqueeText.textContent = 'If you want to go back, press the back button';
      marqueeText.style.top = 'auto';
      marqueeText.style.bottom = '20px';
      marqueeText.style.display = 'block';

      nextButton.textContent = 'BACK';
      currentButtonState = 'back';
      break;
    case 'back':
      // 2画面目から1画面目に戻る
      document.getElementById('screen1').scrollIntoView({ behavior: 'smooth' });
      nextButton.textContent = 'NEXT';
      marqueeText.style.display = 'none';
      currentButtonState = 'next';
      break;
    case 'quit':
      // 2画面目完成後、メニューに戻る
      window.location.href = '../index.html';
      break;
  }
});

</script>
</body>
</html>
