<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>花火</title>
  <!-- リセットCSS 
<link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
-->
<!-- Googleフォント -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Philosopher&display=swap" rel="stylesheet">
<!--画面幅で切り替え-->
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
@font-face {
  font-family: 'SWScrps';
  src: url('fonts/SWScrps.ttf') format('truetype');
}
body {
      font-family:IPAMonaPGothic,Monapo,Mona,sans-serif;
      font-size:16px;
      line-height:18px;
      margin: 0;
      background: #000;
      color:#fff;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
iframe {
    width: 100%;
}
#quitButton {
  position: absolute;
  top: 97%;
  left: 5%;
  transform: translate(-50%, -50%);
  color: white;
  font-family: 'SWScrps', serif;
  font-size: 20px;
  text-decoration: none;
  opacity: 0;
  transition: opacity 1s ease;
  z-index: 10;
  pointer-events: none; /* Initially not clickable */
}
</style>
<body>
<canvas id="canvas"></canvas>
<a id="quitButton" href="../index.html">QUIT</a>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// --- 画像リソース ---
let fireworks = [];
const fireworkImageSources = ['../images/fire1.png', '../images/fire2.png', '../images/fire3.png', '../images/fire4.png'];
const fireworkImages = [];
const faceImageSrc = '../images/face2.png';
const iphoneImageSrc = '../images/iphone3.png';
const soundImageSrc = '../images/sound.png';
let faceImage;
let iphoneImage;
let soundImage;

// --- 状態管理 ---
let faceAlpha = 0;
const iphoneState = {
  alpha: 0,
  x: 0, y: 0, width: 170, height: 303, // 現在のiPhone画像のサイズ
  screen: { x: 14, y: 40, width: 142, height: 222 } // iPhone画面領域を現在のサイズに合わせて再計算
};
const soundState = { alpha: 0, x: 0, y: 0, width: 100, height: 100, shown: false, fadeOut: false };

let iphoneFireworks = [];
let iphoneAnimationState = { active: false, startTime: 0, faceAlpha: 0 };


const particles = []; // 星パーティクル用の配列

// 星パーティクルの初期化
const particleCount = 150; // 星の数
for (let i = 0; i < particleCount; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    radius: Math.random() * 1.2 + 0.3, // 星の大きさ
    vx: (Math.random() - 0.5) * 0.1,   // X方向の移動速度
    vy: (Math.random() - 0.5) * 0.1,   // Y-方向の移動速度
    alpha: Math.random() * 0.5 + 0.2  // 透明度
  });
}


class Firework {
  constructor(x, y, image) {
    this.x = x;
    this.y = y;
    this.image = image; // 使用する画像を保持
    this.particles = [];
    this.hasExploded = false;
    this.fuseTime = Math.random() * 2 + 1; // 爆発までの時間

    const particleCount = 24;
    for (let i = 0; i < particleCount; i++) {
      const angle = (Math.PI * 2 / particleCount) * i;
      this.particles.push({
        angle: angle,
        radius: 0,
        targetRadius: 100 + Math.random() * 80,
        alpha: 1,
        speed: 0.02 + Math.random() * 0.01,
        decay: 0.015 + Math.random() * 0.005
      });
    }
  }

  update(deltaTime) {
    this.fuseTime -= deltaTime;
    if (this.fuseTime <= 0 && !this.hasExploded) {
      this.hasExploded = true;
    }

    if (this.hasExploded) {
      this.particles.forEach(p => {
        if (p.radius < p.targetRadius) {
          p.radius += (p.targetRadius - p.radius) * p.speed;
        }
        if (p.radius > p.targetRadius * 0.5) {
          p.alpha -= p.decay;
        }
        if (p.alpha < 0) p.alpha = 0;
      });
    }
  }

  draw() {
    if (!this.hasExploded) return;

    this.particles.forEach(p => {
      if (p.alpha <= 0) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(p.angle);
      ctx.globalAlpha = p.alpha;
      ctx.drawImage(this.image, p.radius, -this.image.height / 2);
      ctx.restore();
    });
  }
}

function launchFirework() {
  const x = Math.random() * canvas.width * 0.8 + canvas.width * 0.1;
  const y = Math.random() * canvas.height * 0.5 + canvas.height * 0.1;
  // 読み込んだ画像からランダムに1つ選択
  const image = fireworkImages[Math.floor(Math.random() * fireworkImages.length)];
  fireworks.push(new Firework(x, y, image));
}

function launchIphoneFirework() {
  // iPhone画面内のランダムな位置に打ち上げ
  const screenRect = iphoneState.screen;
  const iphoneX = iphoneState.x;
  const iphoneY = iphoneState.y;

  const x = iphoneX + screenRect.x + (Math.random() * screenRect.width * 0.8 + screenRect.width * 0.1);
  const y = iphoneY + screenRect.y + (Math.random() * screenRect.height * 0.5 + screenRect.height * 0.1);

  const image = fireworkImages[Math.floor(Math.random() * fireworkImages.length)];
  iphoneFireworks.push(new Firework(x, y, image));
}

// 顔画像を描画する関数
function drawFace(elapsedTime) {
  const timeSinceAppear = elapsedTime - 15; // 表示開始からの経過時間
  const fadeInDuration = 4.0; // 4秒かけてフェードイン

  if (timeSinceAppear < fadeInDuration) {
    // フェードイン期間
    faceAlpha = (timeSinceAppear / fadeInDuration) * 0.6;
  } else {
    // 明滅期間
    const blinkTime = timeSinceAppear - fadeInDuration;
    const blinkValue = (Math.sin(blinkTime * 3) + 1) / 2;
    faceAlpha = 0.2 + blinkValue * 0.4;
  }

  ctx.save();
  ctx.globalAlpha = Math.max(0, faceAlpha); // 念のため0未満にならないように
  // 画像を画面中央に配置
  const x = canvas.width / 2 - faceImage.width / 2;
  const y = canvas.height / 2 - faceImage.height / 2;
  ctx.drawImage(faceImage, x, y);
  ctx.restore();
}

// iPhoneとサウンドを描画する関数
function drawIphoneAndSound(elapsedTime) {
    // 18秒後: iPhoneフェードイン
    if (elapsedTime > 18 && iphoneState.alpha < 1) {
        iphoneState.alpha += 0.01;
    }
    if (iphoneState.alpha > 0) {
        iphoneState.x = canvas.width / 2 - iphoneState.width / 2;
        iphoneState.y = canvas.height / 2 - iphoneState.height / 2;
        ctx.save();
        ctx.globalAlpha = iphoneState.alpha;
        ctx.drawImage(iphoneImage, iphoneState.x, iphoneState.y, iphoneState.width, iphoneState.height);
        ctx.restore();
    }

    // 20秒後: サウンドアイコン表示
    if (elapsedTime > 20 && !soundState.shown) {
        soundState.shown = true;
    }

    // 21秒後: サウンドアイコンをフェードアウト
    if (elapsedTime > 21) {
        soundState.fadeOut = true;
    }

    if (soundState.shown) {
        if (!soundState.fadeOut && soundState.alpha < 1) {
            soundState.alpha += 0.05; // フェードイン
        } else if (soundState.fadeOut && soundState.alpha > 0) {
            soundState.alpha -= 0.05; // フェードアウト
        }
        soundState.alpha = Math.max(0, Math.min(1, soundState.alpha));

        if (soundState.alpha > 0) {
            soundState.x = iphoneState.x + iphoneState.width - 50;
            soundState.y = iphoneState.y + 50;
            ctx.save();
            ctx.globalAlpha = soundState.alpha;
            ctx.drawImage(soundImage, soundState.x, soundState.y, soundState.width, soundState.height);
            ctx.restore();
        }
    }

    // 22秒後: iPhone内アニメーション開始
    if (elapsedTime > 22 && !iphoneAnimationState.active) {
        iphoneAnimationState.active = true;
        iphoneAnimationState.startTime = elapsedTime;
    }
}



// 星を描画する関数
function drawParticles() {
  particles.forEach(p => {
    // 位置を更新
    p.x += p.vx;
    p.y += p.vy;

    // 画面外に出たら反対側から出現
    if (p.x < 0) p.x = canvas.width;
    if (p.x > canvas.width) p.x = 0;
    if (p.y < 0) p.y = canvas.height;
    if (p.y > canvas.height) p.y = 0;

    // グラデーションでぼんやり光る星を表現
    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius * 2);
    grad.addColorStop(0, `rgba(255, 255, 240, ${p.alpha})`);
    grad.addColorStop(1, `rgba(255, 255, 240, 0)`);
    ctx.fillStyle = grad;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fill();
  });
}

let animationStartTime = 0;
let lastTime = 0;
function animate(timestamp) {
  if (animationStartTime === 0) {
    animationStartTime = timestamp;
  }
  const deltaTime = (timestamp - lastTime) / 1000;
  lastTime = timestamp;

  ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  drawParticles(); // 星を描画

  // --- 背景の花火 ---
  fireworks.forEach(fw => {
    fw.update(deltaTime);
    fw.draw();
  });
  fireworks = fireworks.filter(fw => !fw.hasExploded || fw.particles.some(p => p.alpha > 0));

  // 15秒経過したら顔の表示処理を呼び出す
  const elapsedTime = (timestamp - animationStartTime) / 1000;
  if (elapsedTime > 15) {
      drawFace(elapsedTime);
  }

  // iPhoneとサウンドのシーケンス
  drawIphoneAndSound(elapsedTime);

  // --- iPhone内アニメーション ---
  if (iphoneAnimationState.active) {
    ctx.save();

    // クリッピング領域を設定
    const screenRect = iphoneState.screen;
    ctx.beginPath();
    ctx.rect(iphoneState.x + screenRect.x, iphoneState.y + screenRect.y, screenRect.width, screenRect.height);
    ctx.clip();

    // iPhone内の花火
    iphoneFireworks.forEach(fw => {
        fw.update(deltaTime);
        fw.draw();
    });
    iphoneFireworks = iphoneFireworks.filter(fw => !fw.hasExploded || fw.particles.some(p => p.alpha > 0));
    if (Math.random() < 0.03) {
        launchIphoneFirework();
    }

    // iPhone内の顔
    const iphoneElapsedTime = elapsedTime - iphoneAnimationState.startTime;
    if (iphoneElapsedTime > 15) {
        const timeSinceAppear = iphoneElapsedTime - 15;
        const fadeInDuration = 4.0;
        if (timeSinceAppear < fadeInDuration) {
            iphoneAnimationState.faceAlpha = (timeSinceAppear / fadeInDuration) * 0.6;
        } else {
            const blinkTime = timeSinceAppear - fadeInDuration;
            const blinkValue = (Math.sin(blinkTime * 3) + 1) / 2;
            iphoneAnimationState.faceAlpha = 0.2 + blinkValue * 0.4;
        }
        ctx.globalAlpha = Math.max(0, iphoneAnimationState.faceAlpha);
        const faceX = iphoneState.x + iphoneState.width / 2 - faceImage.width / 2;
        const faceY = iphoneState.y + iphoneState.height / 2 - faceImage.height / 2;
        ctx.drawImage(faceImage, faceX, faceY);
    }

    ctx.restore(); // クリッピング解除
  }

  // 画像は読み込み済みなので、ランダムで打ち上げ
  if (Math.random() < 0.02) {
    launchFirework();
  }

  requestAnimationFrame(animate);
}

// 全ての画像読み込みを待つ
const allImageSources = [...fireworkImageSources, faceImageSrc, iphoneImageSrc, soundImageSrc];
const imagePromises = allImageSources.map(src => {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve({img, src}); // 画像オブジェクトと元のパスをセットで解決
    img.onerror = reject;
    img.src = src;
  });
});

Promise.all(imagePromises).then(results => {
  results.forEach(result => { // result は {img: Image, src: string} オブジェクト
      if (result.src === faceImageSrc) {
          faceImage = result.img;
      } else if (result.src === iphoneImageSrc) {
          iphoneImage = result.img;
      } else if (result.src === soundImageSrc) {
          soundImage = result.img;
      } else {
          fireworkImages.push(result.img);
      }
  });
  requestAnimationFrame(animate); // 全て読み込み終わったらアニメーション開始

  // 15秒後にQUITボタンを表示
  setTimeout(() => {
    const quitButton = document.getElementById('quitButton');
    if (quitButton) {
      quitButton.style.opacity = '1';
      quitButton.style.pointerEvents = 'auto'; // Make it clickable
    }
  }, 15000);
});

</script>
</body>
</html>
